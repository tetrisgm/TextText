# Shared HTTPS port. PartyParty retains its own TLS and certificate renewal.
global
    maxconn 2048

defaults
    mode tcp
    timeout connect 5s
    timeout client 300s
    timeout server 300s

frontend shared_https
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend texttext_https if { req.ssl_sni -i texttext.app www.texttext.app }
    default_backend partyparty_https

backend texttext_https
    server texttext 127.0.0.1:8444 send-proxy-v2

backend partyparty_https
    server origin 127.0.0.1:8443
